<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SecGen — stylized globe with orbit">
  <!-- Background disc (NATO-blue accent used throughout the app) -->
  <rect width="64" height="64" rx="12" fill="#004990"/>

  <!-- Orbit ring (behind the globe, softened) -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none"
           stroke="#fafaf9" stroke-width="2" stroke-opacity="0.55"
           transform="rotate(-20 32 32)"/>

  <!-- Globe outline -->
  <circle cx="32" cy="32" r="14" fill="none"
          stroke="#fafaf9" stroke-width="2.75"/>

  <!-- Equator -->
  <line x1="18" y1="32" x2="46" y2="32"
        stroke="#fafaf9" stroke-width="2.25"/>

  <!-- Meridian curvature (vertical ellipse suggests sphericity) -->
  <ellipse cx="32" cy="32" rx="6" ry="14" fill="none"
           stroke="#fafaf9" stroke-width="2.25"/>
</svg>
